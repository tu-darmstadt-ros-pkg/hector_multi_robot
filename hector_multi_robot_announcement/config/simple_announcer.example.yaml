# Example configuration for hector_multi_robot_announcement::SimpleMultiRobotAnnouncer.
#
# The announcer:
#   * publishes a RobotAnnouncement on `robot_announcement` (namespaced) and `/robot_announcement`
#     (global, transient_local) on startup, and republishes it on every successful add/remove via the
#     `add_sensor`/`remove_sensor`/`add_visualization`/`remove_visualization` services.
#   * forwards `<robot_namespace>/tf` to global `/tf` (when `enable_tf_forwarding` is true),
#     prefixing frame ids with `<robot_namespace>/` and rate-limiting per child frame.
#   * forwards `<robot_namespace>/tf_static` to global `/tf_static` (no rate limit).
#   * forwards each `topic_forwarding.topics.<id>` topic into `<robot_namespace>/<subnamespace>/`,
#     rewriting every frame_id/child_frame_id to match the prefixed global tf tree.
#
# Frames listed in `tf_config.global_frames` are NOT prefixed when forwarded (use this for
# shared frames such as `world` that exist in the common multi-robot tf tree). The same set is
# reused by topic forwarding.
#
# Per-frame rate limits are declared under `tf_config.frame_configs.<child_frame_id>.rate` in Hz.
# Frames not listed are limited to `tf_config.max_rate` Hz.

# `/**` applies these parameters regardless of the node's namespace; replace with the node's
# fully-qualified name (e.g. `/robot1/simple_announcer`) to target a single instance.
/**:
  ros__parameters:
    robot_id: "robot1"
    robot_name: "Robot One"
    robot_namespace: "/robot1"
    # string describing the type of robot, can be custom defined by the user
    # but if possible stick to one of the following types for better interoperability
    # wheeled | tracked | legged | quadcopter | humanoid
    type: "tracked"

    configuration:
      # Optional string key value pairs describing the robot's configuration.
      main_track: "true"
      # JSON array of the flipper link frame names. Could also be only two links if front and
      # back are linked. Please follow convention of starting with front (left) going clockwise
      # viewed from above.
      flipper_links: '["flipper_fl_link", "flipper_fr_link", "flipper_br_link", "flipper_bl_link"]'

    # Topics a UI (e.g. rviz) can auto-add as displays for this robot. Each map key is the
    # visualization id and doubles as the `name` fallback. Only `topic` is required; an entry
    # without it is skipped.
    # `default_visibility` is one of :
    #   * `hidden` (off until the user enables it, the default)
    #   * `when_active` (shown while this robot is active/selected in the UI) or
    #   * `always` (shown regardless of which robot is active).
    # Nested `hints` become the message's `keys`/`values` display hint store.
    visualizations:
      elevation_map:
        name: "Map Bag" # Must be unique across visualizations for this robot.
        topic: "map_bag" # relative to ros_namespace; absolute (/...) allowed
        message_type: "map_bag_msgs/msg/MapBag"
        kind: "map"
        group: "Mapping"
        default_visibility: "when_active"
        hints:
          colormap: "turbo"
      planned_path:
        name: "Planned Path"
        topic: "move_base/plan"
        message_type: "nav_msgs/msg/Path"
        kind: "path"
        group: "Navigation"
        default_visibility: "always"
        hints:
          color: "#e91e63"
          line_width: "0.05"

    # Sensor values a UI can display for this robot. Each map key is the sensor id (copied verbatim
    # into the message `id`) and doubles as the `name` fallback. Only `topic` is required; an entry
    # without it is skipped. `field` selects the message member to display (dotted for nested access).
    # Nested `hints` become the message's `keys`/`values` display/threshold hint store; the keys below
    # are conventions consumers understand (decimals, timeout, warn_above/below, danger_above/below,
    # warn_topic), but any custom key is allowed.
    sensors:
      co2:
        name: "CO2"
        topic: "co2" # relative to ros_namespace; absolute (/...) allowed
        message_type: "std_msgs/msg/Float64"
        field: "data"
        unit: "ppm"
        icon: "co2"
        hints:
          decimals: "0"
          warn_above: "1000"
          danger_above: "2000"
      radiation:
        name: "Radiation"
        topic: "radiation"
        message_type: "std_msgs/msg/Float64"
        field: "data"
        unit: "μSv/h"
        icon: "radioactive"
        hints:
          decimals: "2"
          timeout: "5.0"
          warn_topic: "radiation_detected"

    status:
      # Hz; publishes RobotStatus on `robot_status` (latched). Omit or set 0 to disable status
      # publishing (also disables battery monitoring and the `set_status` service).
      status_frequency: 1.0
      # Hz; publishes Heartbeat on `robot_heartbeat`. Omit or set 0 to disable.
      heartbeat_frequency: 10.0 # 10 Hz are about 160 B/s bandwidth
      battery:
        # Aggregation for RobotStatus.battery_level:
        # "minimum" (lowest battery level), or "combined" (pooled batteries)
        aggregation: "minimum"
        state_topics: # Topics publishing sensor_msgs/msg/BatteryState
          left: "battery_left"
          right: "battery_right"

    enable_tf_forwarding: true
    tf_config:
      max_rate: 30.0 # Max rate for all frames not listed below (Hz)

      # Frames that should not be prefixed. To share no frames, omit this key entirely;
      # an empty list (global_frames: []) aborts the node on startup (empty YAML sequences
      # have no element type).
      global_frames:
        - world
      frame_configs:
        base_link:
          rate: 10.0
        odom:
          rate: 5.0
        # Explicit override: forward every message regardless of incoming rate.
        imu_link:
          rate: 0.0

    # Re-publishes onboard topics into `<robot_namespace>/<subnamespace>/<topic>`, rewriting every
    # frame_id/child_frame_id to match the prefixed global tf tree (e.g. odom -> robot1/odom).
    # Presence-driven: with no `topics` entries it stays inert (no enable flag). The message type is
    # auto-discovered from the graph unless `message_type` pins it. No per-topic rate limiting, so
    # target low-rate topics (paths, maps, plans).
    topic_forwarding:
      subnamespace: "world" # `<ns>/world/<topic>`; must be non-empty
      topics:
        planned_path:
          topic: "plan" # relative to robot_namespace; leading '/' allowed
          message_type: "nav_msgs/msg/Path" # optional; auto-discovered if omitted
        grid_map:
          topic: "map" # type auto-discovered from the graph
